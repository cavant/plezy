name: Build & Sign Plezy APKs (Morphe)

on:
  schedule:
    # Check daily at 06:00 UTC for new upstream Plezy releases
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if tag already exists'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-and-sign.yml'

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout custom fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check upstream Plezy latest release & Auto-Sync
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_JSON=$(curl -s https://api.github.com/repos/edde746/plezy/releases/latest)
          UPSTREAM_TAG=$(echo "$UPSTREAM_JSON" | jq -r '.tag_name // empty')
          UPSTREAM_BODY=$(echo "$UPSTREAM_JSON" | jq -r '.body // empty')
          echo "tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "$UPSTREAM_BODY" > /tmp/upstream_notes.md
          echo "Latest upstream release tag: $UPSTREAM_TAG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/edde746/plezy.git || true
          git fetch upstream --tags --force
          git fetch upstream main

          MERGED_UPSTREAM="false"
          if [ -n "$UPSTREAM_TAG" ] && git rev-parse "tags/$UPSTREAM_TAG" >/dev/null 2>&1; then
            if ! git merge-base --is-ancestor "tags/$UPSTREAM_TAG" HEAD; then
              echo "Merging new upstream release tag $UPSTREAM_TAG into main..."
              if ! git merge "tags/$UPSTREAM_TAG" --no-edit -m "Auto-sync upstream release $UPSTREAM_TAG"; then
                echo "Resolving merge conflicts by preserving upstream core files & pubspec version..."
                git checkout --theirs pubspec.yaml pubspec.lock || true
                git add pubspec.yaml pubspec.lock
                git commit --no-edit -m "Auto-sync upstream release $UPSTREAM_TAG"
              fi
              git push origin HEAD:main
              MERGED_UPSTREAM="true"
            else
              echo "Upstream tag $UPSTREAM_TAG is already an ancestor of HEAD."
            fi
          fi
          echo "merged=$MERGED_UPSTREAM" >> "$GITHUB_OUTPUT"

      - name: Determine Release Tag, Flutter Version & Check Status
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOCAL_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          FORK_TAG="v${LOCAL_VERSION#v}"
          echo "tag=$FORK_TAG" >> "$GITHUB_OUTPUT"
          echo "Target Release Tag: $FORK_TAG"

          FLUTTER_VER=$(grep 'FLUTTER_VERSION:' .github/workflows/build.yml | head -n 1 | cut -d'"' -f2)
          if [ -z "$FLUTTER_VER" ]; then
            FLUTTER_VER="3.47.1"
          fi
          echo "flutter_version=$FLUTTER_VER" >> "$GITHUB_OUTPUT"
          echo "Detected upstream Flutter SDK version: $FLUTTER_VER"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_build }}" = "true" ]; then
            echo "Build forced via workflow_dispatch"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "Build triggered via push to main"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.upstream.outputs.merged }}" = "true" ]; then
            echo "Merged new upstream release into main. Building $FORK_TAG..."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif gh release view "$FORK_TAG" &>/dev/null; then
            echo "Release $FORK_TAG already exists in this fork and upstream is synced. Skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $FORK_TAG does not exist yet. Building."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java 21
        if: steps.check_release.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        if: steps.check_release.outputs.should_build == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.check_release.outputs.flutter_version }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        if: steps.check_release.outputs.should_build == 'true'
        run: flutter pub get

      - name: Decode Morphe Keystore
        if: steps.check_release.outputs.should_build == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/morphe.p12

      - name: Build Split APKs
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          flutter build apk --release --split-per-abi --dart-define=ENABLE_UPDATE_CHECK=true

      - name: Sign APKs with Morphe Keystore
        if: steps.check_release.outputs.should_build == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ANDROID_SDK_ROOT=$ANDROID_HOME
          BUILD_TOOLS_VERSION=$(ls -1 "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -n 1)
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          
          mkdir -p release-apks
          
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            arch=$(basename "$apk" | sed -e 's/app-//' -e 's/-release.apk//')
            out="release-apks/plezy-${arch}.apk"
            echo "Signing $apk -> $out"
            
            $APKSIGNER sign --ks android/app/morphe.p12 \
              --ks-type PKCS12 \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$out" \
              "$apk"
              
            $APKSIGNER verify --verbose "$out"
          done

      - name: Publish Release with Standalone Signed APKs
        if: steps.check_release.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.check_release.outputs.tag }}"
          UPSTREAM_TAG="${{ steps.upstream.outputs.tag }}"
          NOTES=$(cat /tmp/upstream_notes.md 2>/dev/null || echo "Custom automated build of Plezy for Android TV / NVIDIA Shield TV")
          
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG exists. Updating APK assets..."
            gh release upload "$TAG" release-apks/*.apk --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" release-apks/*.apk \
              --title "Plezy $TAG (Morphe Signed for Shield TV)" \
              --notes "Custom build of Plezy $TAG (based on upstream $UPSTREAM_TAG) signed with Morphe.keystore for Shield TV in-place OTA updates.
              
            ### Custom Fork Enhancements:
            - **NVIDIA Shield TV Optimizations Toggle:** Dedicated toggle in Settings > Services applying 4K DoVi/HDR10 frame-queue limits, 0.5x OSD plane resolution, 48MB Skia cache cap, shader bypass, and automatic background RAM trimming.
            - **Home Assistant Webhook Sync:** State-change deduplicated play/pause/stop webhook sync for smart lighting and soundbar automations.
            - **Custom Themes:** Plex Classic Amber, Cinema Crimson, Moonlight, and Material You Dynamic themes.
            - **In-Place Shield TV OTA:** Automatic in-app update checks directly downloading and installing Morphe-signed APKs.
            
            ### Upstream Release Notes:
            $NOTES"
          fi

name: Build & Sign Plezy APKs (Morphe)

on:
  schedule:
    # Check upstream daily at 05:00 UTC
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if tag already exists'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout custom fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check upstream Plezy latest release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          UPSTREAM_JSON=$(curl -s https://api.github.com/repos/edde746/plezy/releases/latest)
          UPSTREAM_TAG=$(echo "$UPSTREAM_JSON" | jq -r '.tag_name')
          UPSTREAM_BODY=$(echo "$UPSTREAM_JSON" | jq -r '.body')
          echo "tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
          echo "$UPSTREAM_BODY" > /tmp/upstream_notes.md
          echo "Latest upstream release tag: $UPSTREAM_TAG"

      - name: Check if release already built in fork
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_build }}" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists in this fork. Skipping."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New release $TAG detected. Proceeding to build."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge Upstream Release into Fork
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git remote add upstream https://github.com/edde746/plezy.git 2>/dev/null || true
          git fetch upstream --tags
          TAG="${{ steps.upstream.outputs.tag }}"
          # Merge upstream release tag keeping our custom theme and OTA changes intact
          git merge "tags/$TAG" -X ours -m "chore(sync): auto-merge upstream release $TAG" || true

      - name: Setup Java
        if: steps.check_release.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        if: steps.check_release.outputs.should_build == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        if: steps.check_release.outputs.should_build == 'true'
        run: flutter pub get

      - name: Decode Morphe Keystore
        if: steps.check_release.outputs.should_build == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/morphe.keystore

      - name: Build Split APKs
        if: steps.check_release.outputs.should_build == 'true'
        run: |
          flutter build apk --release --split-per-abi

      - name: Sign APKs with Morphe Keystore
        if: steps.check_release.outputs.should_build == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ANDROID_SDK_ROOT=$ANDROID_HOME
          BUILD_TOOLS_VERSION=$(ls -1 "$ANDROID_SDK_ROOT/build-tools" | sort -V | tail -n 1)
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          
          mkdir -p release-apks
          
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            arch=$(basename "$apk" | sed -e 's/app-//' -e 's/-release.apk//')
            out="release-apks/plezy-${arch}.apk"
            echo "Signing $apk -> $out"
            
            $APKSIGNER sign --ks android/app/morphe.keystore \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              --out "$out" \
              "$apk"
              
            $APKSIGNER verify --verbose "$out"
          done

      - name: Publish Release with Standalone Signed APKs
        if: steps.check_release.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.upstream.outputs.tag }}"
          NOTES=$(cat /tmp/upstream_notes.md)
          
          gh release create "$TAG" release-apks/*.apk \
            --title "Plezy $TAG (Morphe Signed for Shield TV)" \
            --notes "Custom build of Plezy $TAG signed with Morphe.keystore for Shield TV in-place OTA updates.
            
          ### Upstream Notes:
          $NOTES"
